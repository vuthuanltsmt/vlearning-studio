appId: vn.vlearning.studio
productName: VLearning Studio

directories:
  output: dist-desktop

files:
  - desktop/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VLearning Studio

artifactName: VLearning-Studio-Setup.${ext}