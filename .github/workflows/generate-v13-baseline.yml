name: Validate V13 Prisma migrations (no database writes)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'prisma/**'
      - 'tests/**'
      - 'scripts/check-production-database-host.mjs'
      - 'lib/permissions.ts'
      - 'app/ai-lessons/**'
      - 'app/api/ai-lessons/**'
      - '.github/workflows/generate-v13-baseline.yml'
  push:
    branches:
      - feature/v13-0a-ai-lesson-foundation
      - feature/v13-1-ai-notebooklm-compose
      - feature/v13-2-ai-lesson-editor
    paths:
      - 'prisma/**'
      - 'tests/**'
      - 'scripts/check-production-database-host.mjs'
      - 'lib/permissions.ts'
      - 'app/ai-lessons/**'
      - 'app/api/ai-lessons/**'
      - '.github/workflows/generate-v13-baseline.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://example:example@localhost:5432/unused
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test access role policy
        run: node --experimental-strip-types --test tests/ai-lesson-permissions.test.mjs
      - name: TypeScript and Next.js production build (no database writes)
        run: npm run build
      - name: Check AI Lesson API ownership guards
        run: node --test tests/ai-lesson-route-guards.test.mjs
      - name: Validate Neon Production endpoint release gate (synthetic URLs only)
        run: node --test tests/production-db-host.test.mjs
      - name: Check migration is additive only
        run: node --test tests/production-migration-safety.test.mjs
      - name: Verify NotebookLM AI draft authorization and flow
        run: node --test tests/notebooklm-compose.test.mjs
      - name: Validate current Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Validate original Prisma schema
        run: npx prisma validate --schema prisma/baseline-existing-schema.prisma
      - name: Generate independent baseline reference without database
        run: |
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/baseline-existing-schema.prisma --script --output baseline-reference.sql
          test -s baseline-reference.sql
      - name: Compare committed baseline SQL with generated reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          reference=Path("baseline-reference.sql").read_text()
          baseline=Path("prisma/migrations/20261001_existing_schema_baseline/migration.sql").read_text()
          for label,script in (("generated",reference),("committed",baseline)):
              print(label, "CREATE TABLE:", len(re.findall(r'CREATE TABLE ',script)), "CREATE INDEX:", len(re.findall(r'CREATE (?:UNIQUE )?INDEX ',script)), "FOREIGN KEY:", len(re.findall(r'FOREIGN KEY ',script)))
              assert len(re.findall(r'CREATE TABLE ',script))==4
              assert len(re.findall(r'CREATE (?:UNIQUE )?INDEX ',script))==9
              assert len(re.findall(r'FOREIGN KEY ',script))==2
          tables = lambda s: set(re.findall(r'CREATE TABLE "(\w+)"',s))
          indexes = lambda s: set(re.findall(r'CREATE (?:UNIQUE )?INDEX "(\w+)"',s))
          assert tables(reference)==tables(baseline)
          assert indexes(reference)==indexes(baseline)
          print("Baseline tables and index names match Prisma-generated reference.")
          PY
      - name: Upload reference and committed baseline (review only)
        uses: actions/upload-artifact@v4
        with:
          name: v13-baseline-sql-review
          path: |
            baseline-reference.sql
            prisma/migrations/20261001_existing_schema_baseline/migration.sql
          retention-days: 7
